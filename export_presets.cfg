[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="data/*.json,assets/audio/*.json"
exclude_filter="docs/*,tests/*,artifacts/*,tools/*,dev/*,services/*"
export_path="build/EchoIsland.exe"

[preset.0.options]
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
application/modify_resources=false

[preset.1]
name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="data/*.json,assets/audio/*.json"
exclude_filter="docs/*,tests/*,artifacts/*,tools/*,dev/*,services/*"
export_path="build/EchoIsland-macOS.zip"

[preset.1.options]
binary_format/architecture="universal"
application/bundle_identifier="org.echoisland.treasuregame"
application/short_version="1.0.0"
application/version="1.0.0"
codesign/codesign=1
notarization/notarization=0
codesign/entitlements/audio_input=false
codesign/entitlements/camera=false
codesign/entitlements/app_sandbox/network_client=false
codesign/entitlements/app_sandbox/network_server=false
